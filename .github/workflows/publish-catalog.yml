name: Publish AMI catalog

on:
  repository_dispatch:
    types: [module-release, localization-release, resources-release]
  push:
    branches: [main]
    paths:
      - catalog-sources.json
      - localization/**
      - localization-sources.json
      - content-release-sources.json
      - resources/**
      - scripts/**
      - tests/**
      - .github/workflows/publish-catalog.yml
  pull_request:
    paths:
      - catalog-sources.json
      - localization/**
      - localization-sources.json
      - content-release-sources.json
      - resources/**
      - scripts/**
      - tests/**
      - .github/workflows/publish-catalog.yml
  workflow_dispatch:
    inputs:
      count:
        description: Maximum number of releases per product
        type: number
        default: 10
      include_prereleases:
        description: Include beta, alpha and RC releases
        type: boolean
        default: true
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ami-catalog-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Re-read current history after the workflow concurrency queue.
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.event.repository.default_branch }}
          persist-credentials: true
      - name: Checkout shared localization engine
        uses: actions/checkout@v6
        with:
          repository: Gurux/Gurux.Updater.Net
          ref: main
          path: .updater
          persist-credentials: false
      - name: Set up localization validator runtime
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build shared localization engine
        shell: bash
        run: |
          dotnet build .updater/Development/Gurux.Updater.Tool -c Release
          validator="$GITHUB_WORKSPACE/.updater/Development/Gurux.Updater.Tool/bin/Release/net10.0/Gurux.Updater.Tool.dll"
          test -f "$validator"
          echo "GURUX_LOCALIZATION_VALIDATOR=$validator" >> "$GITHUB_ENV"
      - name: Test catalog generator
        run: python3 -m unittest discover -s tests -v
      - name: Import successfully published content Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_REPOSITORY: ${{ github.event.client_payload.repository }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_EVENT: ${{ github.event.action }}
        shell: bash
        run: |
          args=()
          if [[ "$DISPATCH_EVENT" == "localization-release" || "$DISPATCH_EVENT" == "resources-release" ]]; then
            test -n "$DISPATCH_REPOSITORY" && test -n "$DISPATCH_TAG"
            args+=(--repository "$DISPATCH_REPOSITORY" --tag "$DISPATCH_TAG")
          fi
          python3 scripts/import_content_releases.py "${args[@]}"
      - name: Generate catalog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.count || 10 }}
          INCLUDE_PRERELEASES: ${{ github.event_name != 'workflow_dispatch' || inputs.include_prereleases }}
        shell: bash
        run: |
          args=(--count "$RELEASE_COUNT")
          if [[ "$INCLUDE_PRERELEASES" != "true" ]]; then
            args+=(--stable-only)
          fi
          python3 scripts/build_catalog.py "${args[@]}"
          python3 -m json.tool _site/catalog.json > /dev/null
          python3 -c "import xml.etree.ElementTree as ET; assert ET.parse('_site/rss.xml').getroot().tag == 'rss'"
          touch _site/.nojekyll
          dotnet "$GURUX_LOCALIZATION_VALIDATOR" localization validate-store --index _site/localization/localization-index.json
          dotnet "$GURUX_LOCALIZATION_VALIDATOR" content validate-resources --catalog-root _site
      - name: Commit immutable history before deploying its complete artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          git add -- localization/ resources/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish changed localization packages [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v5
